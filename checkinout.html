<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Check-in / Check-out — DJ Family Kost</title>

  <link
    rel="stylesheet"
    href="app.css"
  >

</head>


<body data-page="checkinout">

<header class="nav">

  <div class="container nav-inner">

    <a
      class="brand"
      href="portal.html"
    >

      <span class="brand-mark"></span>

      DJ FAMILY KOST · TENANT

    </a>


    <nav class="nav-links">

      <a href="portal.html">Dashboard</a>

      <a href="pembayaran.html">Pembayaran</a>

      <a href="maintenance.html">Maintenance</a>

      <a href="checkinout.html">Check-in/out</a>

      <a href="cafe.html">Cafe</a>

      <a href="laundry.html">Laundry</a>

      <a
        href="#"
        id="logoutTop"
        class="login-top"
      >
        Keluar
      </a>

    </nav>

  </div>

</header>


<section class="section">

  <div class="container">

    <a
      class="back"
      href="portal.html"
    >
      ← Kembali ke portal
    </a>


    <div class="eyebrow">
      TENANT
    </div>


    <h1>
      Check-in / Check-out
    </h1>


    <p class="lead"
       style="margin:0;max-width:800px">

      Data serah-terima otomatis
      menggunakan identitas tenant
      yang sedang login.

    </p>


    <div class="card form-card">

      <form id="checkinoutForm">

        <div class="form-grid">

          <div class="field">

            <label>
              Tenant
            </label>

            <input
              id="cioTenant"
              readonly
            >

          </div>


          <div class="field">

            <label>
              No. Kamar
            </label>

            <input
              id="cioRoom"
              readonly
            >

          </div>


          <div class="field">

            <label>
              Jenis Proses
            </label>

            <select
              id="cioProcess"
              required
            >

              <option value="">
                Pilih
              </option>

              <option value="CHECK-IN">
                Check-in
              </option>

              <option value="CHECK-OUT">
                Check-out
              </option>

            </select>

          </div>


          <div class="field">

            <label>
              Tanggal Proses
            </label>

            <input
              id="cioDate"
              type="date"
              required
            >

          </div>


          <div class="field">

            <label>
              Jumlah Kunci / Akses
            </label>

            <input
              id="cioKeys"
              type="number"
              min="0"
            >

          </div>


          <div class="field">

            <label>
              Kunci Dikembalikan?
            </label>

            <select
              id="cioKeysReturned"
            >

              <option>
                Ya
              </option>

              <option>
                Tidak
              </option>

            </select>

          </div>


          <div class="field full">

            <label>
              Kondisi Kamar
            </label>

            <textarea
              id="cioRoomCondition"
              required
            ></textarea>

          </div>


          <div class="field full">

            <label>
              Catatan Kondisi
            </label>

            <textarea
              id="cioNote"
            ></textarea>

          </div>


          <div class="field full">

            <label>
              Foto Kondisi Kamar
            </label>

            <input
              id="cioFiles"
              type="file"
              accept="image/*"
              multiple
            >

          </div>


          <div class="field full">

            <label>
              Foto Meter Listrik
            </label>

            <input
              id="cioMeterFiles"
              type="file"
              accept="image/*"
              multiple
            >

          </div>


          <div class="field">

            <label>
              Ada Kerusakan / Kehilangan?
            </label>

            <select
              id="cioDamage"
            >

              <option>
                Tidak
              </option>

              <option>
                Ya
              </option>

            </select>

          </div>


          <div class="field">

            <label>
              Perkiraan Pengurangan Deposit
            </label>

            <input
              id="cioDepositReduction"
              type="number"
              min="0"
              value="0"
            >

          </div>


          <div class="field full">

            <label>
              Detail Kerusakan / Kehilangan
            </label>

            <textarea
              id="cioDamageDetail"
            ></textarea>

          </div>


          <div class="field full">

            <label>
              Catatan Fasilitas
            </label>

            <textarea
              id="cioFacility"
            ></textarea>

          </div>


          <div class="field full">

            <label>
              Pernyataan Tenant
            </label>

            <textarea
              id="cioStatement"
            ></textarea>

          </div>

        </div>


        <div
          id="cioMessage"
          class="message"
        ></div>


        <button
          id="cioButton"
          class="btn btn-primary"
          style="margin-top:18px;width:100%"
        >

          Kirim Check-in / Check-out

        </button>

      </form>

    </div>

  </div>

</section>


<footer class="footer">

  <div class="container footer-inner">

    <div>
      <strong>
        DJ FAMILY KOST
      </strong>
    </div>

    <small>
      © 2026 DJ Family Kost
    </small>

  </div>

</footer>


<script src="dj-kost.js"></script>

</body>
</html>
