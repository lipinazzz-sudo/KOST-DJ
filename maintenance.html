<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Maintenance — DJ Family Kost</title>

  <link
    rel="stylesheet"
    href="app.css"
  >

</head>


<body data-page="maintenance">

<header class="nav">

  <div class="container nav-inner">

    <a
      class="brand"
      href="portal.html"
    >

      <span class="brand-mark"></span>

      DJ FAMILY KOST · TENANT

    </a>


    <nav class="nav-links">

      <a href="portal.html">Dashboard</a>

      <a href="pembayaran.html">Pembayaran</a>

      <a href="maintenance.html">Maintenance</a>

      <a href="checkinout.html">Check-in/out</a>

      <a href="cafe.html">Cafe</a>

      <a href="laundry.html">Laundry</a>

      <a
        href="#"
        id="logoutTop"
        class="login-top"
      >
        Keluar
      </a>

    </nav>

  </div>

</header>


<section class="section">

  <div class="container">

    <a
      class="back"
      href="portal.html"
    >
      ← Kembali ke portal
    </a>


    <div class="eyebrow">
      TENANT ONLY
    </div>


    <h1>
      Laporan Maintenance
    </h1>


    <p class="lead"
       style="margin:0;max-width:800px">

      Laporkan kerusakan fasilitas.
      Sistem otomatis mengaitkan
      laporan dengan tenant dan
      nomor kamar yang sedang login.

    </p>


    <div class="card form-card">

      <form id="maintenanceForm">

        <div class="form-grid">

          <div class="field">

            <label>
              Tenant
            </label>

            <input
              id="maintenanceTenant"
              readonly
            >

          </div>


          <div class="field">

            <label>
              No. Kamar
            </label>

            <input
              id="maintenanceRoom"
              readonly
            >

          </div>


          <div class="field">

            <label>
              Lokasi Masalah
            </label>

            <input
              id="maintenanceLocation"
              placeholder="Contoh: kamar mandi"
            >

          </div>


          <div class="field">

            <label>
              Jenis Masalah
            </label>

            <select
              id="maintenanceType"
              required
            >

              <option value="">
                Pilih
              </option>

              <option>
                Listrik
              </option>

              <option>
                Air
              </option>

              <option>
                AC
              </option>

              <option>
                Fasilitas kamar
              </option>

              <option>
                Bangunan
              </option>

              <option>
                Lainnya
              </option>

            </select>

          </div>


          <div class="field">

            <label>
              Urgensi
            </label>

            <select
              id="maintenanceUrgency"
              required
            >

              <option value="">
                Pilih
              </option>

              <option>
                Rendah
              </option>

              <option>
                Sedang
              </option>

              <option>
                Tinggi
              </option>

            </select>

          </div>


          <div class="field">

            <label>
              Izin Masuk Kamar
            </label>

            <select
              id="maintenanceAccess"
            >

              <option>
                Ya
              </option>

              <option>
                Tidak
              </option>

            </select>

          </div>


          <div class="field">

            <label>
              Waktu Nyaman
            </label>

            <input
              id="maintenanceTime"
              type="datetime-local"
            >

          </div>


          <div class="field full">

            <label>
              Deskripsi
            </label>

            <textarea
              id="maintenanceDescription"
              required
            ></textarea>

          </div>


          <div class="field full">

            <label>
              Foto Kerusakan
            </label>

            <input
              id="maintenanceFiles"
              type="file"
              accept="image/*"
              multiple
            >

          </div>

        </div>


        <div
          id="maintenanceMessage"
          class="message"
        ></div>


        <button
          id="maintenanceButton"
          class="btn btn-primary"
          style="margin-top:18px;width:100%"
        >

          Kirim Laporan

        </button>

      </form>

    </div>

  </div>

</section>


<footer class="footer">

  <div class="container footer-inner">

    <div>
      <strong>
        DJ FAMILY KOST
      </strong>
    </div>

    <small>
      © 2026 DJ Family Kost
    </small>

  </div>

</footer>


<script src="dj-kost.js"></script>

</body>
</html>
