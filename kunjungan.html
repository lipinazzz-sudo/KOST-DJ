<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Kunjungan — DJ Family Kost</title>

  <link
    rel="stylesheet"
    href="app.css"
  >

</head>


<body data-page="visit">

<header class="nav">

  <div class="container nav-inner">

    <a
      class="brand"
      href="index.html"
    >

      <span class="brand-mark"></span>

      DJ FAMILY KOST

    </a>


    <nav class="nav-links">

      <a href="index.html#kamar">Kamar</a>

      <a href="aturan.html">Aturan Kost</a>

      <a href="kunjungan.html">Kunjungan</a>

      <a href="pendaftaran.html">Pendaftaran</a>

      <a href="hubungi.html">Hubungi Kami</a>

      <a
        class="login-top"
        href="login.html"
      >
        Login Tenant
      </a>

    </nav>

  </div>

</header>


<section class="section">

  <div class="container">

    <a
      class="back"
      href="index.html"
    >
      ← Kembali ke beranda
    </a>


    <div class="eyebrow">
      CALON TENANT
    </div>


    <h1>
      Ajukan Kunjungan
    </h1>


    <p class="lead"
       style="margin:0;max-width:800px">

      Pilih kamar yang ingin
      dikunjungi dan ajukan
      jadwal kepada pengelola.

    </p>


    <div class="card form-card">

      <form id="visitForm">

        <div class="form-grid">

          <div class="field">

            <label>Nama Lengkap</label>

            <input
              id="visitName"
              required
            >

          </div>


          <div class="field">

            <label>No. WhatsApp</label>

            <input
              id="visitPhone"
              type="tel"
              required
            >

          </div>


          <div class="field">

            <label>Email</label>

            <input
              id="visitEmail"
              type="email"
            >

          </div>


          <div class="field">

            <label>Kamar yang Diminati</label>

            <select
              id="visitRoom"
              required
            >

              <option value="">
                Memuat kamar...
              </option>

            </select>

          </div>


          <div class="field">

            <label>Tanggal Kunjungan</label>

            <input
              id="visitDate"
              type="date"
              required
            >

          </div>


          <div class="field">

            <label>Waktu Kunjungan</label>

            <input
              id="visitTime"
              type="time"
              required
            >

          </div>


          <div class="field full">

            <label>Catatan</label>

            <textarea
              id="visitNote"
              placeholder="Keterangan tambahan bila ada"
            ></textarea>

          </div>

        </div>


        <div
          id="visitMessage"
          class="message"
        ></div>


        <button
          id="visitButton"
          class="btn btn-primary"
          style="margin-top:18px;width:100%"
        >
          Kirim Pengajuan
        </button>

      </form>

    </div>

  </div>

</section>


<footer class="footer">

  <div class="container footer-inner">

    <div>

      <strong>
        DJ FAMILY KOST
      </strong>

      <br>

      <small>
        Hunian yang tertib,
        nyaman, dan terkelola.
      </small>

    </div>

    <small>
      © 2026 DJ Family Kost
    </small>

  </div>

</footer>


<script src="dj-kost.js"></script>

</body>
</html>
