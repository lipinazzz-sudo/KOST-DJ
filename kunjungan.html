<section class="section">

    <a

      ← Kembali ke beranda
    </a>


    <div class="eyebrow">
      CALON TENANT
    </div>


    <h1>
      Ajukan Kunjungan
    </h1>


    <p class="lead"
       style="margin:0;max-width:800px">

      Pilih kamar yang ingin
      dikunjungi dan ajukan
      jadwal kepada pengelola.

    </p>


    <div class="card form-card">

      <form id="visitForm">

        <div class="form-grid">

          <div class="field">

            <label>Nama Lengkap</label>

            <input
              id="visitName"
              required
            >

          </div>


          <div class="field">

            <label>No. WhatsApp</label>

            <input
              id="visitPhone"
              type="tel"
              required
            >

          </div>


          <div class="field">

            <label>Email</label>

            <input
              id="visitEmail"
              type="email"
            >

          </div>


          <div class="field">

            <label>Kamar yang Diminati</label>

            <select
              id="visitRoom"
              required
            >

              <option value="">
                Memuat kamar...
              </option>

            </select>

          </div>


          <div class="field">

            <label>Tanggal Kunjungan</label>

            <input
              id="visitDate"
              type="date"
              required
            >

          </div>


          <div class="field">

            <label>Waktu Kunjungan</label>

            <input
              id="visitTime"
              type="time"
              required
            >

          </div>


          <div class="field full">

            <label>Catatan</label>

            <textarea
              id="visitNote"
              placeholder="Keterangan tambahan bila ada"
            ></textarea>

          </div>

        </div>


        <div
          id="visitMessage"
          class="message"
        ></div>


        <button
          id="visitButton"
          class="btn btn-primary"
          style="margin-top:18px;width:100%"
        >
          Kirim Pengajuan
        </button>

      </form>

    </div>

  </div>

</section>
