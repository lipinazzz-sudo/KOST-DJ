<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Login Tenant — DJ Family Kost</title>

<link
    rel="stylesheet"
    href="app.css?v=20260925-tenant-login-01"
>

<style>

.login-page{
    min-height:100vh;
    display:grid;
    place-items:center;
    padding:30px 18px;
}

.login-card{
    width:min(100%,520px);
    background:#fff;
    border:1px solid #e5e7eb;
    border-radius:22px;
    padding:34px;
    box-shadow:0 18px 50px rgba(15,23,42,.08);
}

.login-card h1{
    margin:8px 0 10px;
}

.login-card p{
    color:#667085;
    line-height:1.7;
}

.field{
    margin-top:18px;
}

.field label{
    display:block;
    font-weight:700;
    margin-bottom:8px;
}

.field input{
    width:100%;
    padding:14px 15px;
    border:1px solid #dfe3eb;
    border-radius:12px;
    background:#fff;
    font:inherit;
    outline:none;
    box-sizing:border-box;
}

.field input:focus{
    border-color:#7c8ba1;
    box-shadow:0 0 0 3px rgba(23,33,59,.06);
}

.login-button{
    width:100%;
    margin-top:22px;
    border:0;
    cursor:pointer;
}

.login-button:disabled{
    opacity:.65;
    cursor:wait;
}

.login-message{
    margin-top:16px;
    padding:13px 14px;
    border-radius:12px;
    display:none;
    font-size:14px;
}

.login-message.error{
    display:block;
    background:#fff1f2;
    color:#b42318;
}

.login-message.success{
    display:block;
    background:#ecfdf3;
    color:#027a48;
}

.login-footer{
    margin-top:22px;
    text-align:center;
    color:#667085;
    font-size:13px;
}

</style>

</head>

<body>

<div class="login-page">

    <div class="login-card">

        <div class="eyebrow">
            TENANT PORTAL
        </div>

        <h1>
            Login Tenant
        </h1>

        <p>
            Masukkan Tenant ID dan password yang telah
            diberikan oleh pengelola DJ Family Kost.
        </p>


        <form id="tenantLoginForm">

            <div class="field">

                <label for="tenantId">
                    Tenant ID
                </label>

                <input
                    id="tenantId"
                    name="tenantId"
                    type="text"
                    autocomplete="username"
                    placeholder="Contoh: TEN-001"
                    required
                >

            </div>


            <div class="field">

                <label for="password">
                    Password
                </label>

                <input
                    id="password"
                    name="password"
                    type="password"
                    autocomplete="current-password"
                    placeholder="Masukkan password"
                    required
                >

            </div>


            <button
                class="btn btn-primary login-button"
                id="loginButton"
                type="submit"
            >
                Masuk
            </button>


            <div
                class="login-message"
                id="loginMessage"
            ></div>

        </form>


        <div class="login-footer">

            <a href="index.html">
                ← Kembali ke beranda
            </a>

        </div>

    </div>

</div>


<script>

const TENANT_API_URL =
    "https://script.google.com/macros/s/AKfycbyZWhxliQiNuRYOjDTfgxcs-6SItWb1m7UD01-cC4E_6sU3p10mNKqmE6y0jPyqISKy_g/exec";


const form =
    document.getElementById(
        "tenantLoginForm"
    );


const tenantIdInput =
    document.getElementById(
        "tenantId"
    );


const passwordInput =
    document.getElementById(
        "password"
    );


const loginButton =
    document.getElementById(
        "loginButton"
    );


const messageBox =
    document.getElementById(
        "loginMessage"
    );


function showMessage(
    message,
    type
){

    messageBox.textContent =
        message;

    messageBox.className =
        "login-message " +
        type;

}


form.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        const tenantId =
            tenantIdInput.value
                .trim()
                .toUpperCase();


        const password =
            passwordInput.value;


        if(
            !tenantId ||
            !password
        ){

            showMessage(
                "Tenant ID dan password wajib diisi.",
                "error"
            );

            return;

        }


        loginButton.disabled =
            true;

        loginButton.textContent =
            "Memeriksa...";


        showMessage(
            "",
            ""
        );


        try{

            const response =
                await fetch(
                    TENANT_API_URL,
                    {
                        method:"POST",

                        headers:{
                            "Content-Type":
                                "text/plain;charset=utf-8"
                        },

                        body:
                            JSON.stringify({

                                action:
                                    "login",

                                tenantId:
                                    tenantId,

                                password:
                                    password

                            })
                    }
                );


            const result =
                await response.json();


            if(
                !result ||
                result.ok !== true ||
                !result.data
            ){

                throw new Error(
                    result &&
                    result.error
                        ? result.error
                        : "Login gagal."
                );

            }


            const session = {

                tenantId:
                    result.data.tenantId,

                nama:
                    result.data.nama,

                kamar:
                    result.data.kamar,

                email:
                    result.data.email,

                status:
                    result.data.status,

                sessionToken:
                    result.data.sessionToken,

                sessionExpires:
                    result.data.sessionExpires

            };


            sessionStorage.setItem(
                "djTenantSession",
                JSON.stringify(
                    session
                )
            );


            /*
             * Hapus session demo lama.
             */

            sessionStorage.removeItem(
                "djTenantDemo"
            );

            sessionStorage.removeItem(
                "djTenantName"
            );

            sessionStorage.removeItem(
                "djTenantId"
            );

            sessionStorage.removeItem(
                "djTenantRoom"
            );


            showMessage(
                "Login berhasil. Membuka portal...",
                "success"
            );


            setTimeout(
                function(){

                    window.location.href =
                        "portal.html";

                },
                350
            );


        }catch(error){

            console.error(
                "Tenant login error:",
                error
            );


            showMessage(
                error.message ||
                "Tidak dapat terhubung ke server.",
                "error"
            );


            passwordInput.value =
                "";


        }finally{

            loginButton.disabled =
                false;

            loginButton.textContent =
                "Masuk";

        }

    }
);

</script>

</body>
</html>
