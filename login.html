<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Login Tenant — DJ Family Kost</title>

<link
    rel="stylesheet"
    href="app.css?v=20260925-master-entry-02"
>

<style>

.login-page{
    min-height:100vh;
    display:grid;
    place-items:center;
    padding:30px 18px;
}

.login-card{
    width:min(100%,520px);
    background:#fff;
    border:1px solid #e5e7eb;
    border-radius:22px;
    padding:34px;
    box-shadow:0 18px 50px rgba(15,23,42,.08);
}

.login-card h1{
    margin:8px 0 10px;
}

.login-card p{
    color:#667085;
    line-height:1.7;
}

.field{
    margin-top:18px;
}

.field label{
    display:block;
    font-weight:700;
    margin-bottom:8px;
}

.field input{
    width:100%;
    box-sizing:border-box;
    padding:14px 15px;
    border:1px solid #dfe3eb;
    border-radius:12px;
    background:#fff;
    font:inherit;
    outline:none;
}

.login-button{
    width:100%;
    margin-top:22px;
}

.login-button:disabled{
    opacity:.65;
    cursor:wait;
}

.login-message{
    display:none;
    margin-top:16px;
    padding:13px 14px;
    border-radius:12px;
    font-size:14px;
}

.login-message.error{
    display:block;
    background:#fff1f2;
    color:#b42318;
}

.login-message.success{
    display:block;
    background:#ecfdf3;
    color:#027a48;
}

.login-footer{
    margin-top:22px;
    text-align:center;
    font-size:13px;
}

</style>

</head>


<body>


<div class="login-page">

<div class="login-card">

<div class="eyebrow">
    TENANT PORTAL
</div>


<h1>
    Login Tenant
</h1>


<p>
    Masukkan Tenant ID dan password yang telah
    diberikan oleh pengelola DJ Family Kost.
</p>


<form
    id="loginForm"
    novalidate
>


<div class="field">

<label for="tenantId">
    Tenant ID
</label>

<input
    id="tenantId"
    type="text"
    autocomplete="username"
    placeholder="Contoh: TEN-001"
>


</div>


<div class="field">

<label for="password">
    Password
</label>

<input
    id="password"
    type="password"
    autocomplete="current-password"
>


</div>


<button
    id="loginButton"
    type="submit"
    class="btn btn-primary login-button"
>
    Masuk
</button>


<div
    id="message"
    class="login-message"
></div>


</form>


<div class="login-footer">

<a href="index.html">
    ← Kembali ke beranda
</a>

</div>

</div>

</div>


<script>


const API_URL =
    "https://script.google.com/macros/s/AKfycbyZWhxliQiNuRYOjDTfgxcs-6SItWb1m7UD01-cC4E_6sU3p10mNKqmE6y0jPyqISKy_g/exec";


/*
 * Kode khusus untuk membuka pintu Master.
 *
 * Ini BUKAN password Master.
 */
const MASTER_ENTRY_CODE =
    "999999";


const form =
    document.getElementById(
        "loginForm"
    );


const tenantIdInput =
    document.getElementById(
        "tenantId"
    );


const passwordInput =
    document.getElementById(
        "password"
    );


const loginButton =
    document.getElementById(
        "loginButton"
    );


const message =
    document.getElementById(
        "message"
    );


function showMessage(
    text,
    type
){

    message.textContent =
        text;


    message.className =
        "login-message " +
        type;

}


form.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        const id =
            tenantIdInput.value
                .trim()
                .toUpperCase();


        const password =
            passwordInput.value;


        /*
         * ====================================================
         * MASTER ENTRY
         * ====================================================
         *
         * Password TIDAK diperlukan di sini.
         *
         * 999999 hanya membuka halaman Master.
         */

        if(
            id ===
            MASTER_ENTRY_CODE
        ){

            passwordInput.value =
                "";


            window.location.href =
                "master.html";


            return;

        }


        /*
         * ====================================================
         * VALIDASI TENANT
         * ====================================================
         */

        if(
            !id
        ){

            showMessage(
                "Tenant ID wajib diisi.",
                "error"
            );

            tenantIdInput.focus();

            return;

        }


        if(
            !password
        ){

            showMessage(
                "Password wajib diisi.",
                "error"
            );

            passwordInput.focus();

            return;

        }


        loginButton.disabled =
            true;


        loginButton.textContent =
            "Memeriksa...";


        showMessage(
            "",
            ""
        );


        try{

            const response =
                await fetch(
                    API_URL,
                    {

                        method:
                            "POST",

                        headers:{
                            "Content-Type":
                                "text/plain;charset=utf-8"
                        },

                        body:
                            JSON.stringify({

                                action:
                                    "login",

                                tenantId:
                                    id,

                                password:
                                    password

                            })

                    }
                );


            const result =
                await response.json();


            if(
                !result ||
                result.ok !== true ||
                !result.data
            ){

                throw new Error(
                    result &&
                    result.error
                        ? result.error
                        : "Login gagal."
                );

            }


            /*
             * Simpan session tenant.
             */

            sessionStorage.setItem(
                "djTenantSession",
                JSON.stringify(
                    result.data
                )
            );


            /*
             * Bersihkan session demo lama.
             */

            sessionStorage.removeItem(
                "djTenantDemo"
            );

            sessionStorage.removeItem(
                "djTenantName"
            );

            sessionStorage.removeItem(
                "djTenantId"
            );

            sessionStorage.removeItem(
                "djTenantRoom"
            );


            showMessage(
                "Login berhasil. Membuka portal...",
                "success"
            );


            setTimeout(
                function(){

                    window.location.href =
                        "portal.html";

                },
                300
            );


        }catch(error){

            console.error(
                "Tenant login error:",
                error
            );


            showMessage(
                error.message ||
                "Login gagal.",
                "error"
            );


            passwordInput.value =
                "";


        }finally{

            loginButton.disabled =
                false;


            loginButton.textContent =
                "Masuk";

        }

    }
);

</script>

</body>

</html>
