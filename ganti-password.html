<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ganti Password — DJ Family Kost</title>
<style>
:root{
  --navy:#10182d;
  --gold:#c9974a;
  --green:#168548;
  --red:#b42318;
  --bg:#f6f7fb;
  --text:#17213b;
  --muted:#667085;
  --line:#e6e9f0;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--bg);
  color:var(--text);
  line-height:1.6;
}
.container{
  max-width:760px;
  margin:auto;
  padding:50px 22px 70px;
}
.card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:22px;
  box-shadow:0 18px 50px rgba(16,24,45,.10);
  padding:30px;
}
.eyebrow{
  font-size:12px;
  font-weight:900;
  letter-spacing:.14em;
  color:var(--gold);
  text-transform:uppercase;
}
h1{
  font-size:clamp(38px,6vw,62px);
  line-height:1.05;
  margin:12px 0 14px;
  letter-spacing:-.045em;
}
.lead{
  color:var(--muted);
  font-size:16px;
}
.identity{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
  margin-top:20px;
}
.identity .box{
  border:1px solid var(--line);
  border-radius:14px;
  padding:14px;
}
.identity .label{
  font-size:12px;
  color:var(--muted);
}
.identity .value{
  font-size:18px;
  font-weight:900;
  margin-top:4px;
}
.note{
  margin-top:18px;
  background:#f4f6fa;
  border:1px solid var(--line);
  padding:15px;
  border-radius:14px;
  color:#5e6a80;
  font-size:13px;
}
.field{
  display:flex;
  flex-direction:column;
  gap:7px;
  margin-top:18px;
}
label{
  font-size:13px;
  font-weight:800;
}
input{
  width:100%;
  padding:14px 15px;
  border:1px solid #dfe3eb;
  border-radius:12px;
  background:#fff;
  color:var(--text);
  font:inherit;
  outline:none;
}
input:focus{
  border-color:#9ba8bd;
  box-shadow:0 0 0 3px rgba(23,33,59,.06);
}
button{
  width:100%;
  border:0;
  border-radius:13px;
  padding:13px 18px;
  margin-top:20px;
  background:var(--navy);
  color:#fff;
  font:inherit;
  font-weight:800;
  cursor:pointer;
}
button:disabled{
  opacity:.55;
  cursor:not-allowed;
}
.alert{
  display:none;
  margin-top:16px;
  padding:15px;
  border-radius:14px;
  font-size:14px;
}
.alert.show{display:block}
.alert.error{
  background:#fff1f2;
  border:1px solid #fecdd3;
  color:var(--red);
}
.alert.success{
  background:#eef8f1;
  border:1px solid #cdebd8;
  color:#146c37;
}
</style>
</head>
<body>
<div class="container">
  <div class="eyebrow">TENANT PORTAL</div>
  <h1>Ganti Password</h1>
  <p class="lead">
    Ini adalah login pertama Anda. Password sementara harus diganti
    sebelum Anda dapat menggunakan Portal Tenant.
  </p>

  <div class="card">
    <div class="identity">
      <div class="box">
        <div class="label">Tenant ID</div>
        <div class="value" id="tenantIdDisplay">—</div>
      </div>
      <div class="box">
        <div class="label">Nama</div>
        <div class="value" id="tenantNameDisplay">—</div>
      </div>
    </div>

    <div class="note">
      Password baru minimal <strong>8 karakter</strong> dan harus berbeda
      dari password sementara.
    </div>

    <div class="field">
      <label for="currentPassword">Password Sementara / Saat Ini</label>
      <input
        id="currentPassword"
        type="password"
        autocomplete="current-password"
        placeholder="Masukkan password saat ini"
      >
    </div>

    <div class="field">
      <label for="newPassword">Password Baru</label>
      <input
        id="newPassword"
        type="password"
        autocomplete="new-password"
        placeholder="Minimal 8 karakter"
      >
    </div>

    <div class="field">
      <label for="confirmPassword">Ulangi Password Baru</label>
      <input
        id="confirmPassword"
        type="password"
        autocomplete="new-password"
        placeholder="Ulangi password baru"
      >
    </div>

    <button id="changeButton" type="button">
      Simpan Password Baru
    </button>

    <div id="message" class="alert" role="alert" aria-live="polite"></div>
  </div>
</div>

<script>
const API_URL =
  "https://dj-family-kost.mahjongjong.workers.dev";

function getSession(){
  try{
    return JSON.parse(
      sessionStorage.getItem(
        "djTenantSession"
      ) || "{}"
    );
  }catch(error){
    return {};
  }
}

const session =
  getSession();

const tenantId =
  String(
    session.tenantId || ""
  )
  .trim()
  .toUpperCase();

const sessionToken =
  String(
    session.sessionToken || ""
  ).trim();

const message =
  document.getElementById(
    "message"
  );

const button =
  document.getElementById(
    "changeButton"
  );

document.getElementById(
  "tenantIdDisplay"
).textContent =
  tenantId || "—";

document.getElementById(
  "tenantNameDisplay"
).textContent =
  session.nama || "—";

function showMessage(
  type,
  text
){
  message.className =
    "alert show " + type;

  message.textContent =
    text;
}

if(
  !tenantId ||
  !sessionToken
){
  showMessage(
    "error",
    "Sesi tenant tidak ditemukan. Silakan login kembali."
  );
  button.disabled = true;
}

async function changePassword(){

  const currentPassword =
    document
      .getElementById(
        "currentPassword"
      )
      .value;

  const newPassword =
    document
      .getElementById(
        "newPassword"
      )
      .value;

  const confirmPassword =
    document
      .getElementById(
        "confirmPassword"
      )
      .value;

  if(!currentPassword){
    showMessage(
      "error",
      "Password saat ini wajib diisi."
    );
    return;
  }

  if(newPassword.length < 8){
    showMessage(
      "error",
      "Password baru minimal 8 karakter."
    );
    return;
  }

  if(newPassword !== confirmPassword){
    showMessage(
      "error",
      "Ulangi password baru tidak sama."
    );
    return;
  }

  if(newPassword === currentPassword){
    showMessage(
      "error",
      "Password baru harus berbeda dari password saat ini."
    );
    return;
  }

  button.disabled = true;
  button.textContent = "Menyimpan...";

  try{

    const response =
      await fetch(
        API_URL,
        {
          method:"POST",
          headers:{
            "Content-Type":
              "text/plain;charset=utf-8"
          },
          body:
            JSON.stringify({
              action:
                "changepassword",

              tenantId:
                tenantId,

              sessionToken:
                sessionToken,

              currentPassword:
                currentPassword,

              newPassword:
                newPassword
            })
        }
      );

    let result;

    try{
      result =
        await response.json();
    }catch(error){
      throw new Error(
        "Server mengembalikan respons yang tidak valid."
      );
    }

    if(
      !result ||
      result.ok !== true
    ){
      throw new Error(
        result &&
        result.error
          ? result.error
          : "Password gagal diganti."
      );
    }

    showMessage(
      "success",
      "Password berhasil diganti. Silakan login kembali."
    );

    try{
      sessionStorage.removeItem("djTenantSession");
      sessionStorage.removeItem("djTenantAuth");
      sessionStorage.removeItem("djTenantId");
      sessionStorage.removeItem("djTenantName");
      sessionStorage.removeItem("djTenantRoom");
      sessionStorage.removeItem("djTenantSessionToken");
      sessionStorage.removeItem("djTenantToken");
    }catch(error){}

    button.textContent =
      "Password Berhasil Diganti";

    setTimeout(
      function(){
        window.location.href =
          "login.html";
      },
      900
    );

  }catch(error){

    showMessage(
      "error",
      error &&
      error.message
        ? error.message
        : "Password gagal diganti."
    );

    button.disabled =
      false;

    button.textContent =
      "Simpan Password Baru";
  }
}

button.addEventListener(
  "click",
  changePassword
);
</script>
</body>
</html>
